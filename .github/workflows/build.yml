name: Build Nova

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unzip Nova.zip
        run: |
          unzip -q Nova.zip -d src
          SETTINGS=$(find src -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          echo "PROJECT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: cd "$PROJECT" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Nova-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
